name: rxrelay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rxrelay}
      POSTGRES_USER: ${POSTGRES_USER:-rxrelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rxrelay_dev}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: { memory: 192M, cpus: "0.5" }
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      # Avoid starting a second JVM for every probe on the 8 GB development target.
      # Core/ingestion readiness subsequently verifies an actual Kafka client connection.
      test: ["CMD", "nc", "-z", "127.0.0.1", "9092"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.0" }
    restart: unless-stopped

  core-service:
    build:
      context: .
      dockerfile: services/core-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rxrelay}
      DATABASE_USER: ${POSTGRES_USER:-rxrelay}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-rxrelay_dev}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SHORTAGE_TOPIC: ${SHORTAGE_TOPIC:-rxrelay.shortage.observed.v1}
      AVAILABILITY_TOPIC: ${AVAILABILITY_TOPIC:-rxrelay.availability.changed.v1}
      NOTIFICATION_TOPIC: ${NOTIFICATION_TOPIC:-rxrelay.notification.created.v1}
      DEAD_LETTER_TOPIC: ${DEAD_LETTER_TOPIC:-rxrelay.availability.dlq.v1}
      CONSUMER_MAX_RETRIES: ${CONSUMER_MAX_RETRIES:-2}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-1MB}
      MAX_REQUEST_HEADER_SIZE: ${MAX_REQUEST_HEADER_SIZE:-16KB}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    ports: ["${CORE_PORT:-8081}:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    deploy:
      resources:
        limits: { memory: 640M, cpus: "1.0" }
    restart: unless-stopped
    stop_grace_period: 30s

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      CORE_SERVICE_URL: http://core-service:8081
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-1MB}
      MAX_REQUEST_HEADER_SIZE: ${MAX_REQUEST_HEADER_SIZE:-16KB}
    ports: ["8080:8080"]
    depends_on:
      core-service: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    deploy:
      resources:
        limits: { memory: 384M, cpus: "0.5" }
    restart: unless-stopped
    stop_grace_period: 20s

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    environment:
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      RXNORM_ENABLED: ${RXNORM_ENABLED:-true}
      INGESTION_MAX_RECORDS: ${INGESTION_MAX_RECORDS:-2000}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SHORTAGE_TOPIC: ${SHORTAGE_TOPIC:-rxrelay.shortage.observed.v1}
      HTTP_RETRY_ATTEMPTS: ${HTTP_RETRY_ATTEMPTS:-3}
      RXNORM_CACHE_TTL_SECONDS: ${RXNORM_CACHE_TTL_SECONDS:-86400}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MANUAL_INGESTION_ENABLED: ${MANUAL_INGESTION_ENABLED:-true}
    ports: ["8090:8090"]
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }
    restart: unless-stopped
    stop_grace_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["5173:8080"]
    depends_on:
      gateway: { condition: service_healthy }
      ingestion-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    deploy:
      resources:
        limits: { memory: 96M, cpus: "0.25" }
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
