name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: ./mvnw --batch-mode -DskipTests package
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install build==1.5.0
      - run: python -m build --wheel services/ingestion-service
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - uses: actions/upload-artifact@v4
        with:
          name: rxrelay-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            services/gateway/target/gateway-*.jar
            services/core-service/target/core-service-*.jar
            services/ingestion-service/dist/*.whl
            apps/web/dist/

  publish:
    needs: artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: gateway
            dockerfile: services/gateway/Dockerfile
          - image: core-service
            dockerfile: services/core-service/Dockerfile
          - image: ingestion-service
            dockerfile: services/ingestion-service/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        if: ${{ vars.RXRELAY_PUBLISH_IMAGES == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/rxrelay-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ vars.RXRELAY_PUBLISH_IMAGES == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
