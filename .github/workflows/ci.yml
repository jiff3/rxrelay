name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode spotless:check test spotbugs:check

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ingestion-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ingestion-service/requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run contract:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  contracts-and-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - uses: azure/setup-kubectl@v4
        with: { version: v1.31.4 }
      - name: Render Kubernetes objects without requiring a cluster
        run: kubectl kustomize infrastructure/kubernetes > /tmp/rxrelay-kubernetes.yaml

  container-build:
    needs: [java, python, web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            dockerfile: services/gateway/Dockerfile
          - name: core-service
            dockerfile: services/core-service/Dockerfile
          - name: ingestion-service
            dockerfile: services/ingestion-service/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: rxrelay/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: .tools,node_modules,target,.venv
