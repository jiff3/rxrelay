apiVersion: v1
kind: ConfigMap
metadata:
  name: rxrelay-config
  namespace: rxrelay
data:
  DATABASE_URL: jdbc:postgresql://postgres:5432/rxrelay
  DATABASE_USER: rxrelay
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  CORE_SERVICE_URL: http://core-service:8081
  SPRING_PROFILES_ACTIVE: production
  ENVIRONMENT: production
  MANUAL_INGESTION_ENABLED: "false"
  # Reserved .invalid origin fails closed until the target overlay supplies its HTTPS host.
  CORS_ALLOWED_ORIGINS: https://rxrelay.invalid
  SHORTAGE_TOPIC: rxrelay.shortage.observed.v1
  AVAILABILITY_TOPIC: rxrelay.availability.changed.v1
  NOTIFICATION_TOPIC: rxrelay.notification.created.v1
  DEAD_LETTER_TOPIC: rxrelay.availability.dlq.v1
  CONSUMER_MAX_RETRIES: "2"
  OUTBOX_MAX_ATTEMPTS: "8"
  OPENFDA_BASE_URL: https://api.fda.gov/drug/shortages.json
  RXNORM_BASE_URL: https://rxnav.nlm.nih.gov
  RXNORM_ENABLED: "true"
  INGESTION_MAX_RECORDS: "2000"
  HTTP_RETRY_ATTEMPTS: "3"
  RXNORM_CACHE_TTL_SECONDS: "86400"
