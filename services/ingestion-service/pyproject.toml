[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rxrelay-ingestion"
version = "1.0.0"
description = "Bounded openFDA shortage ingestion and RxNorm normalization for RxRelay"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.12,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "python-json-logger>=3.2,<5",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
rxrelay-ingest = "rxrelay_ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rxrelay_ingestion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rxrelay_ingestion"]
